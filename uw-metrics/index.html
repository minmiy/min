<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>신계약 심사지표 산출기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one working column — 업로드 → ① 심사지표 → ② 데이터 점검 → ③ 주제별 요약·다운로드, read top to bottom in the order the monthly job runs. */
:root{
  --paper:#f5f7f8; --sheet:#ffffff; --ink:#17232b; --ink-2:#4a5a64; --ink-3:#7b8a93;
  --line:#d9e0e4; --line-2:#e9eef0;
  --accent:#1d5b73; --accent-soft:#e2eef2; --accent-2:#6c8fa0;
  --good:#1e6b3a; --good-bg:#e3f1e7; --warn:#8a5a00; --warn-bg:#fbf0d6; --crit:#a42020; --crit-bg:#fbe4e1;
  --st-ok:#1d5b73; --st-cond:#79a6b8; --st-rej:#c2453b; --st-delay:#d39a2c; --st-wd:#9aa7ae; --st-pend:#d5dde1;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f171c; --sheet:#152129; --ink:#e3eaee; --ink-2:#a9b8c0; --ink-3:#7d8e97;
  --line:#2a3a44; --line-2:#1e2c34;
  --accent:#7cc0d8; --accent-soft:#1b3440; --accent-2:#4f7f93;
  --good:#7fd19b; --good-bg:#16301f; --warn:#f0c46a; --warn-bg:#352a12; --crit:#ff9a8f; --crit-bg:#3a1a18;
  --st-ok:#5aa8c4; --st-cond:#3f7286; --st-rej:#e0675c; --st-delay:#d9a440; --st-wd:#62737c; --st-pend:#33454f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f171c; --sheet:#152129; --ink:#e3eaee; --ink-2:#a9b8c0; --ink-3:#7d8e97;
  --line:#2a3a44; --line-2:#1e2c34;
  --accent:#7cc0d8; --accent-soft:#1b3440; --accent-2:#4f7f93;
  --good:#7fd19b; --good-bg:#16301f; --warn:#f0c46a; --warn-bg:#352a12; --crit:#ff9a8f; --crit-bg:#3a1a18;
  --st-ok:#5aa8c4; --st-cond:#3f7286; --st-rej:#e0675c; --st-delay:#d9a440; --st-wd:#62737c; --st-pend:#33454f;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:20px 64px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{margin:0;text-wrap:balance}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
button,.btn{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.top .eyebrow{font-size:12px;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.top h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2)}
.meta b{color:var(--ink);font-weight:600}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:6px;padding:10px 14px;font-size:13px}

/* upload */
.uploads{display:grid;grid-template-columns:1fr 1fr auto;gap:12px}
.drop{border:1.5px dashed var(--line);border-radius:8px;background:var(--sheet);padding:14px 16px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .lbl{font-weight:600}
.drop .sub{font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.drop .fn{font-size:13px;color:var(--accent);font-weight:500;overflow-wrap:anywhere}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.side-actions{display:flex;flex-direction:column;gap:8px;justify-content:center}
.err{color:var(--crit);background:var(--crit-bg);border-radius:6px;padding:10px 14px;font-size:13px}

/* sections */
section.blk{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.blk-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
.blk-h h2{font-size:18px;font-weight:700;display:flex;gap:10px;align-items:baseline}
.blk-h h2 .step{font-family:var(--f-mono);font-size:13px;color:var(--accent);font-weight:500}
.blk-h .hint{font-size:12.5px;color:var(--ink-3)}
h3{font-size:14px;font-weight:600;color:var(--ink-2)}

/* check summary */
.chk-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.chk-sum>div{background:var(--sheet);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.chk-sum .k{font-size:12px;color:var(--ink-3);letter-spacing:.02em}
.chk-sum .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.chk-sum .v.crit{color:var(--crit)} .chk-sum .v.warn{color:var(--warn)} .chk-sum .v.good{color:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;border-radius:999px;padding:3px 10px;border:1px solid var(--line);background:var(--sheet);color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.chip b{font-variant-numeric:tabular-nums}
.chip.crit{background:var(--crit-bg);color:var(--crit);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.good{background:var(--good-bg);color:var(--good);border-color:transparent}
button.chip{cursor:pointer;padding:3px 10px;font-weight:400}
button.chip[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;max-width:100%}
.tbl.scroll{max-height:320px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap}
th{background:var(--paper);color:var(--ink-2);font-weight:600;font-size:12px;position:sticky;top:0;z-index:1}
td.n,th.n{text-align:right}
td.txt{white-space:normal;min-width:240px}
td.cell-crit{background:var(--crit-bg);color:var(--crit);font-weight:600}
td.cell-warn{background:var(--warn-bg);color:var(--warn);font-weight:600}
tr.total td{font-weight:600;border-top:1.5px solid var(--line)}
.sev{font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 6px}
.sev.e{background:var(--crit-bg);color:var(--crit)} .sev.w{background:var(--warn-bg);color:var(--warn)}

/* metric cards */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;min-width:0}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.card.good::before{background:var(--good)} .card.crit::before{background:var(--crit)}
.card.crit{background:var(--crit-bg)}
.card .nm{font-size:13px;color:var(--ink-2);font-weight:600}
.card .big{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.card .big small{font-size:15px;font-weight:500;color:var(--ink-2);margin-left:2px}
.card .fx{font-size:12px;color:var(--ink-3);font-family:var(--f-mono)}
.card .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.delta{font-variant-numeric:tabular-nums;font-weight:600}
.delta.up{color:var(--good)} .delta.down{color:var(--crit)} .delta.flat{color:var(--ink-3)}
.delta.neutral{color:var(--ink-2)}
.bar{display:flex;height:10px;border-radius:3px;overflow:hidden;background:var(--line-2)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.grid2>div{display:flex;flex-direction:column;gap:8px;min-width:0}

/* comment */
textarea{width:100%;min-height:80px;font:inherit;font-size:14px;line-height:1.7;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);resize:vertical}
.cmts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cmt{border:1px solid var(--line);border-radius:8px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative;overflow:hidden}
.cmt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line)}
.cmt.crit::before{background:var(--crit)} .cmt.warn::before{background:var(--warn)} .cmt.good::before{background:var(--good)}
.cmt.wide{grid-column:1/-1}
.cmt-h{min-height:26px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px}
.cmt-h label{font-weight:600;font-size:13.5px}
.cmt textarea{min-height:64px;padding:8px 10px;font-size:13.5px;line-height:1.65;resize:vertical}
.cmt.busy textarea{opacity:.55}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{font-size:12.5px;color:var(--ink-3)}

/* settings & definitions */
details{border:1px solid var(--line);border-radius:8px;background:var(--sheet)}
details>summary{cursor:pointer;padding:12px 16px;font-weight:600}
details .in{padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2)}
.form input[type=number]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums}
.form .ck{flex-direction:row;align-items:center;gap:8px}
#holi{min-height:90px;font-family:var(--f-mono);font-size:12.5px}
dl.defs{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);gap:10px 16px;margin:0;font-size:13px}
dl.defs dt{font-weight:600}
dl.defs dd{margin:0;color:var(--ink-2)}
dl.defs code{font-family:var(--f-mono);font-size:12px;background:var(--paper);padding:1px 5px;border-radius:4px;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:6px;font-size:13px;z-index:10;max-width:calc(100% - 32px)}

@media (max-width:900px){.cmts{grid-template-columns:1fr}.cmt.wide{grid-column:auto}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.uploads{grid-template-columns:1fr 1fr}.side-actions{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}}
@media (max-width:560px){.wrap{padding-inline:16px}.cards,.uploads{grid-template-columns:1fr}.chk-sum{grid-template-columns:repeat(2,minmax(0,1fr))}section.blk{padding:16px}.top h1{font-size:22px}dl.defs{grid-template-columns:1fr;gap:2px 0}dl.defs dd{margin-bottom:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">계약심사부 · 월 마감</div>
      <h1>신계약 심사지표 산출기</h1>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="uploads">
    <label class="drop" id="dropCur" for="fileCur">
      <span class="lbl">당월 마감 데이터</span>
      <span class="sub">.xlsx · .xls · .csv — 증번, 계약일자, 채널, 최초·실제심사자, 계약상태, 자동심사결과, 심사시작일, 최초심사일, 특별조건부1</span>
      <span class="fn" id="fnCur"></span>
      <input type="file" id="fileCur" accept=".xlsx,.xls,.csv">
    </label>
    <label class="drop" id="dropPrev" for="filePrev">
      <span class="lbl">전월 마감 데이터 <span style="font-weight:400;color:var(--ink-3)">(선택)</span></span>
      <span class="sub">같은 양식. 넣으면 전월 대비 증감을 함께 계산합니다.</span>
      <span class="fn" id="fnPrev"></span>
      <input type="file" id="filePrev" accept=".xlsx,.xls,.csv">
    </label>
    <div class="side-actions">
      <button id="btnSample" type="button">예시 데이터 불러오기</button>
      <button id="btnTemplate" type="button">업로드 양식 받기</button>
    </div>
  </div>
  <div class="err" id="loadErr" hidden></div>

  <section class="blk" id="secMetric">
    <div class="blk-h">
      <h2><span class="step">①</span>심사지표</h2>
      <span class="hint" id="metricHint"></span>
    </div>
    <div class="cards" id="cards"></div>
    <div class="grid2">
      <div><h3>채널별</h3><div class="tbl"><table id="tblCh"></table></div></div>
      <div><h3>심사결과 통계</h3><div class="tbl"><table id="tblSt"></table></div></div>
    </div>
    <div><h3 style="margin-bottom:8px">심사자별</h3><div class="tbl"><table id="tblRv"></table></div></div>
  </section>

  <section class="blk" id="secCheck">
    <div class="blk-h">
      <h2><span class="step">②</span>데이터 점검</h2>
      <span class="hint">공란, 날짜 순서, 상태 불일치를 행 단위로 확인합니다. 오류 행은 위 지표 산출에서 빠집니다.</span>
    </div>
    <div class="chk-sum" id="chkSum"></div>
    <div class="chips" id="chkTypes"></div>
    <div class="tbl scroll"><table id="tblIssues"></table></div>
  </section>

  <section class="blk" id="secSum">
    <div class="blk-h">
      <h2><span class="step">③</span>요약 코멘트 · 결과표</h2>
      <span class="hint">주제별 코멘트는 직접 고칠 수 있고, 고친 내용이 엑셀에 그대로 들어갑니다.</span>
    </div>
    <div class="cmts" id="comments"></div>
    <div class="actions">
      <button id="btnRedraft" type="button">기준 문안 다시 만들기</button>
      <button id="btnAI" type="button" hidden>AI로 보고 문안 다듬기</button>
      <button id="btnStop" type="button" hidden>중지</button>
      <button id="btnCopy" type="button">전체 복사</button>
      <span style="flex:1"></span>
      <button id="btnXlsx" class="primary" type="button">결과표 엑셀 다운로드</button>
    </div>
    <div class="note" id="sumNote"></div>
  </section>

  <details id="setDetails">
    <summary>산출 기준 설정</summary>
    <div class="in">
      <div class="form">
        <label>3일이내 터치율 목표 (% 이상)<input type="number" id="sTouch" step="0.5" min="0" max="100"></label>
        <label>터치 기준 영업일 (일 이내)<input type="number" id="sDays" step="1" min="0" max="30"></label>
        <label>자동심사율 목표 (% 이상)<input type="number" id="sAuto" step="0.5" min="0" max="100"></label>
        <label>거절률 상한 (% 이하)<input type="number" id="sRej" step="0.5" min="0" max="100"></label>
        <label>전월 대비 변동 표시 (비율, %p)<input type="number" id="sMomP" step="0.5" min="0"></label>
        <label>전월 대비 변동 표시 (건수, %)<input type="number" id="sMomC" step="1" min="0"></label>
        <label class="ck"><input type="checkbox" id="sExcl"> 오류 행은 지표 산출에서 제외</label>
      </div>
      <label class="form" style="display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2)">공휴일 (영업일 계산에서 제외, 한 줄에 하나 · YYYY-MM-DD 이름)
        <textarea id="holi"></textarea>
      </label>
      <div class="actions"><button id="btnApply" class="primary" type="button">기준 적용</button><span class="note">주말과 위 공휴일을 뺀 날을 영업일로 셉니다.</span></div>
    </div>
  </details>

  <details>
    <summary>지표 정의</summary>
    <div class="in">
      <dl class="defs" id="defs"></dl>
    </div>
  </details>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- settings ---------- */
const DEFAULT_HOLIDAYS=`2025-01-01 신정
2025-01-27 임시공휴일
2025-01-28 설날
2025-01-29 설날
2025-01-30 설날
2025-03-03 삼일절 대체
2025-05-05 어린이날·부처님오신날
2025-05-06 대체공휴일
2025-06-03 대통령선거
2025-06-06 현충일
2025-08-15 광복절
2025-10-03 개천절
2025-10-06 추석
2025-10-07 추석
2025-10-08 추석 대체
2025-10-09 한글날
2025-12-25 성탄절
2026-01-01 신정
2026-02-16 설날
2026-02-17 설날
2026-02-18 설날
2026-03-02 삼일절 대체
2026-05-05 어린이날
2026-05-25 부처님오신날 대체
2026-06-03 지방선거
2026-06-06 현충일
2026-08-17 광복절 대체
2026-09-24 추석
2026-09-25 추석
2026-10-05 개천절 대체
2026-10-09 한글날
2026-12-25 성탄절`;
const S={touchTarget:90,touchDays:3,autoTarget:45,rejectMax:5,momP:3,momC:10,excl:true,holidays:DEFAULT_HOLIDAYS};
try{const saved=JSON.parse(localStorage.getItem("uwm-settings")||"null");if(saved)Object.assign(S,saved);}catch(e){}
let HSET=new Set();
function buildHolidays(){HSET=new Set();S.holidays.split(/\n/).forEach(l=>{const p=parseDate(l.trim().slice(0,10));if(p.ok)HSET.add(p.dn);});}

/* ---------- dates & business days ---------- */
function ymd(y,m,d){const t=Date.UTC(y,m-1,d);const dt=new Date(t);
  if(y<2000||y>2100||dt.getUTCFullYear()!==y||dt.getUTCMonth()!==m-1||dt.getUTCDate()!==d)return{bad:true};return{ok:true,dn:t/864e5};}
function parseDate(v){
  if(v===null||v===undefined)return{empty:true};
  if(v instanceof Date)return ymd(v.getFullYear(),v.getMonth()+1,v.getDate());
  if(typeof v==="number"){
    if(v>19000101&&v<21001231)return ymd(Math.floor(v/1e4),Math.floor(v/100)%100,v%100);
    if(v>36000&&v<80000)return{ok:true,dn:Math.floor(v)-25569};
    return{bad:true};}
  const s=String(v).trim();if(!s)return{empty:true};
  if(/^\d{5}(\.\d+)?$/.test(s))return parseDate(Number(s));
  const m=s.match(/^(\d{4})\s*[-./년]?\s*(\d{1,2})\s*[-./월]?\s*(\d{1,2})/);
  if(!m)return{bad:true};return ymd(+m[1],+m[2],+m[3]);}
const fmt=dn=>{if(dn==null)return"";const d=new Date(dn*864e5);return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");};
const isBiz=d=>{const w=((d%7)+7+4)%7;return w!==0&&w!==6&&!HSET.has(d);};
function bizDiff(a,b){if(b<a)return null;let c=0;for(let d=a+1;d<=b;d++)if(isBiz(d))c++;return c;}
function addBiz(d,n){while(n>0){d++;if(isBiz(d))n--;}return d;}

/* ---------- field mapping & normalising ---------- */
const FIELDS=[["no","증번",["증번","증권번호","계약번호"]],["cdate","계약일자",["계약일자","계약일","청약일자","청약일"]],["ch","채널",["채널","판매채널"]],["r1","최초심사자",["최초심사자"]],["r2","실제심사자",["실제심사자","심사자"]],["st","계약상태",["계약상태","상태"]],["auto","자동심사결과",["자동심사결과","자동심사"]],["sdate","심사시작일",["심사시작일","심사시작일자"]],["fdate","최초심사일",["최초심사일","최초심사일자"]],["cond","특별조건부1",["특별조건부1","특별조건부","특별조건"]]];
const STATUSES=["성립","조건부성립","거절","연기","청약철회","심사중"];
const DONE=new Set(["성립","조건부성립","거절","연기","청약철회"]);
function normStatus(v){const s=String(v||"").replace(/\s/g,"");if(!s)return"";
  if(/조건/.test(s))return"조건부성립";if(/거절|사절/.test(s))return"거절";if(/연기/.test(s))return"연기";
  if(/철회|취소/.test(s))return"청약철회";if(/심사중|미결|진행|보류/.test(s))return"심사중";if(/성립|정상|표준/.test(s))return"성립";return"?"+s;}
function normAuto(v){const s=String(v||"").replace(/\s/g,"").toUpperCase();if(!s)return null;
  if(/통과|승인|^Y$|PASS|적합$/.test(s)&&!/부적합/.test(s))return true;
  if(/이관|부적합|수동|^N$|FAIL|미통과|거절/.test(s))return false;return undefined;}
const isAutoName=v=>/^(AUTO|자동|SYSTEM|시스템)$/i.test(String(v||"").trim());

/* ---------- parse workbook into rows ---------- */
function aoaFromFile(file){
  return file.arrayBuffer().then(buf=>{
    let wb;
    if(/\.csv$/i.test(file.name)){
      let text=new TextDecoder("utf-8").decode(buf);
      if(text.includes("\uFFFD")){try{text=new TextDecoder("euc-kr").decode(buf);}catch(e){}}
      wb=XLSX.read(text,{type:"string",raw:true});
    }else wb=XLSX.read(buf,{type:"array"});
    const ws=wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
  });}

function buildDataset(aoa,name){
  const key=s=>String(s||"").replace(/\s/g,"");
  let h=-1;for(let i=0;i<Math.min(aoa.length,15);i++){if(aoa[i].some(c=>["증번","증권번호","계약번호"].includes(key(c)))){h=i;break;}}
  if(h<0)throw new Error("첫 행 근처에서 '증번' 열 제목을 찾지 못했습니다. 첫 시트의 열 제목을 확인해 주세요.");
  const head=aoa[h].map(key);const col={};const missing=[];
  FIELDS.forEach(([k,label,al])=>{const i=head.findIndex(x=>al.includes(x));if(i<0)missing.push(label);else col[k]=i;});
  if(missing.length)throw new Error("필수 열이 없습니다: "+missing.join(", ")+". 열 제목을 양식과 같게 맞춘 뒤 다시 올려 주세요.");
  const rows=[];
  for(let i=h+1;i<aoa.length;i++){const a=aoa[i];if(!a||a.every(c=>String(c).trim()===""))continue;
    const r={line:i+1,raw:{}};FIELDS.forEach(([k])=>{const v=a[col[k]];r.raw[k]=v;});rows.push(r);}
  if(!rows.length)throw new Error("열 제목 아래에 데이터 행이 없습니다.");
  rows.forEach(r=>{const g=k=>String(r.raw[k]??"").trim();
    r.no=g("no");r.ch=g("ch");r.r1=g("r1");r.r2=g("r2");r.stRaw=g("st");r.st=normStatus(r.stRaw);
    r.autoRaw=g("auto");r.auto=normAuto(r.autoRaw);r.cond=g("cond");
    r.pc=parseDate(r.raw.cdate);r.ps=parseDate(r.raw.sdate);r.pf=parseDate(r.raw.fdate);
    r.cd=r.pc.ok?r.pc.dn:null;r.sd=r.ps.ok?r.ps.dn:null;r.fd=r.pf.ok?r.pf.dn:null;});
  // closing month = most common contract month
  const cnt={};rows.forEach(r=>{if(r.cd!=null){const d=new Date(r.cd*864e5);const k=d.getUTCFullYear()*100+d.getUTCMonth()+1;cnt[k]=(cnt[k]||0)+1;}});
  const best=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  if(!best)throw new Error("계약일자를 날짜로 읽을 수 있는 행이 없습니다.");
  const y=Math.floor(best/100),mo=best%100;
  return{name,rows,y,mo,start:Date.UTC(y,mo-1,1)/864e5,end:Date.UTC(y,mo,0)/864e5};}

/* ---------- data checks ---------- */
function check(ds){
  const issues=[];const add=(r,sev,type,field,msg)=>{issues.push({line:r.line,no:r.no,sev,type,field,msg});if(sev==="오류")r.err=true;else r.warn=true;};
  const seen=new Map();
  ds.rows.forEach(r=>{r.err=false;r.warn=false;
    if(!r.no)add(r,"오류","공란","증번","증번이 비어 있음");
    else if(seen.has(r.no))add(r,"오류","중복","증번",`${seen.get(r.no)}행과 증번 중복`);
    else seen.set(r.no,r.line);
    [["pc","계약일자"],["ps","심사시작일"],["pf","최초심사일"]].forEach(([k,lab])=>{if(r[k].bad)add(r,"오류","날짜형식",lab,`날짜로 읽을 수 없음: "${r.raw[k==="pc"?"cdate":k==="ps"?"sdate":"fdate"]}"`);});
    if(r.pc.empty)add(r,"오류","공란","계약일자","계약일자가 비어 있음");
    if(!r.stRaw)add(r,"오류","공란","계약상태","계약상태가 비어 있음");
    else if(r.st.startsWith("?"))add(r,"경고","상태불일치","계약상태",`정의되지 않은 상태값 "${r.stRaw}"`);
    if(r.auto===null)add(r,"오류","공란","자동심사결과","자동심사결과가 비어 있음");
    else if(r.auto===undefined)add(r,"경고","상태불일치","자동심사결과",`해석할 수 없는 값 "${r.autoRaw}"`);
    if(!r.ch)add(r,"경고","공란","채널","채널이 비어 있음 (채널별 집계에서 '미입력'으로 분류)");
    if(r.cd!=null&&(r.cd<ds.start||r.cd>ds.end))add(r,"경고","날짜순서","계약일자",`마감월(${ds.y}.${String(ds.mo).padStart(2,"0")}) 밖의 계약일자 ${fmt(r.cd)}`);
    if(r.cd!=null&&r.sd!=null&&r.sd<r.cd)add(r,"오류","날짜순서","심사시작일",`심사시작일(${fmt(r.sd)})이 계약일자(${fmt(r.cd)})보다 빠름`);
    if(r.sd!=null&&r.fd!=null&&r.fd<r.sd)add(r,"오류","날짜순서","최초심사일",`최초심사일(${fmt(r.fd)})이 심사시작일(${fmt(r.sd)})보다 빠름`);
    if(r.fd!=null&&r.fd>ds.end)add(r,"경고","날짜순서","최초심사일",`최초심사일(${fmt(r.fd)})이 마감일 이후`);
    if(r.auto===false){
      if(r.ps.empty)add(r,"오류","공란","심사시작일","수동심사 건인데 심사시작일이 비어 있음");
      if(!r.r1)add(r,"경고","공란","최초심사자","수동심사 건인데 최초심사자가 비어 있음");
      if(DONE.has(r.st)&&r.pf.empty)add(r,"오류","상태불일치","최초심사일",`계약상태 '${r.st}'인데 최초심사일이 비어 있음`);
      if(DONE.has(r.st)&&r.st!=="청약철회"&&!r.r2)add(r,"경고","공란","실제심사자",`계약상태 '${r.st}'인데 실제심사자가 비어 있음`);
    }
    if(r.auto===true&&["거절","연기","조건부성립"].includes(r.st))add(r,"경고","상태불일치","자동심사결과",`자동심사 통과 건인데 계약상태가 '${r.st}'`);
    if(r.cond&&r.st&&r.st!=="조건부성립"&&r.st!=="심사중")add(r,"경고","상태불일치","특별조건부1",`특별조건부1('${r.cond}')이 있는데 계약상태가 '${r.st}'`);
    if(r.st==="조건부성립"&&!r.cond)add(r,"경고","공란","특별조건부1","조건부성립인데 특별조건부1이 비어 있음");
  });
  ds.issues=issues;return ds;}

/* ---------- metrics ---------- */
const rate=(a,b)=>b?a/b:null;
function compute(ds){
  const rows=ds.rows.filter(r=>!(S.excl&&r.err));
  const D=S.touchDays;
  rows.forEach(r=>{r.lag=null;r.touch=null;
    if(r.auto!==false||r.sd==null)return;
    if(r.fd!=null&&r.fd>=r.sd){r.lag=bizDiff(r.sd,r.fd);r.touch=r.lag<=D?"Y":"N";}
    else if(r.fd==null){const el=bizDiff(r.sd,ds.end);r.touch=(el!=null&&el<=D)?"보류":"N";}
  });
  const agg=list=>{
    const o={total:list.length};
    o.autoBase=list.filter(r=>r.auto===true||r.auto===false).length;
    o.autoPass=list.filter(r=>r.auto===true).length;o.auto=rate(o.autoPass,o.autoBase);
    o.tBase=list.filter(r=>r.touch==="Y"||r.touch==="N").length;o.tIn=list.filter(r=>r.touch==="Y").length;o.touch=rate(o.tIn,o.tBase);
    o.tPend=list.filter(r=>r.touch==="보류").length;
    const lags=list.filter(r=>r.lag!=null).map(r=>r.lag);o.avgLag=lags.length?lags.reduce((a,b)=>a+b,0)/lags.length:null;
    o.done=list.filter(r=>DONE.has(r.st)).length;o.manualDone=list.filter(r=>DONE.has(r.st)&&r.auto===false).length;
    o.pending=list.filter(r=>r.st==="심사중").length;
    o.st={};STATUSES.concat(["기타"]).forEach(s=>o.st[s]=0);list.forEach(r=>{o.st[STATUSES.includes(r.st)?r.st:"기타"]++;});
    const decided=o.st["성립"]+o.st["조건부성립"]+o.st["거절"]+o.st["연기"];o.decided=decided;
    o.reject=rate(o.st["거절"],decided);o.condRate=rate(o.st["조건부성립"],decided);
    return o;};
  const m=agg(rows);m.used=rows.length;
  const chOrder=["설계사","GA","TM","방카","CM"];const chs=[...new Set(rows.map(r=>r.ch||"미입력"))].sort((a,b)=>{const ia=chOrder.indexOf(a),ib=chOrder.indexOf(b);return(ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b);});
  m.byCh=chs.map(c=>({name:c,...agg(rows.filter(r=>(r.ch||"미입력")===c))}));
  const names=[...new Set(rows.filter(r=>r.auto===false).flatMap(r=>[r.r1,r.r2]).filter(n=>n&&!isAutoName(n)))].sort((a,b)=>a.localeCompare(b,"ko"));
  m.byRv=names.map(n=>{const first=rows.filter(r=>r.r1===n&&r.auto===false);const fin=rows.filter(r=>r.r2===n&&r.auto===false);const a=agg(first);
    return{name:n,assigned:first.length,tBase:a.tBase,tIn:a.tIn,touch:a.touch,avgLag:a.avgLag,done:fin.filter(r=>DONE.has(r.st)).length,
      reassigned:first.filter(r=>r.r2&&r.r2!==n).length,reject:rate(fin.filter(r=>r.st==="거절").length,fin.filter(r=>["성립","조건부성립","거절","연기"].includes(r.st)).length)};});
  m.bizDays=0;for(let d=ds.start;d<=ds.end;d++)if(isBiz(d))m.bizDays++;
  ds.m=m;return ds;}

/* ---------- formatting ---------- */
const nf=n=>n==null?"-":Number(n).toLocaleString("ko-KR");
const pct=x=>x==null?"-":(x*100).toFixed(1)+"%";
const ppTxt=(a,b)=>{if(a==null||b==null)return"-";const v=(a-b)*100;return(v>0?"+":v<0?"−":"±")+Math.abs(v).toFixed(1)+"%p";};
const chgTxt=(a,b)=>{if(a==null||!b)return"-";const v=(a-b)/b*100;return(v>0?"+":v<0?"−":"±")+Math.abs(v).toFixed(1)+"%";};
const ymTxt=ds=>`${ds.y}년 ${ds.mo}월`;

/* ---------- state ---------- */
let CUR=null,PREV=null,isSample=false;

function metricList(){
  const m=CUR.m,p=PREV?.m;
  return[
    {key:"touch",name:"3일이내 터치율",val:m.touch,prev:p?.touch,kind:"rate",good:"up",target:S.touchTarget/100,cmp:">=",
      fx:`${nf(m.tIn)} / ${nf(m.tBase)}건`,targetTxt:`${S.touchTarget}% 이상`},
    {key:"auto",name:"자동심사율",val:m.auto,prev:p?.auto,kind:"rate",good:"up",target:S.autoTarget/100,cmp:">=",
      fx:`${nf(m.autoPass)} / ${nf(m.autoBase)}건`,targetTxt:`${S.autoTarget}% 이상`},
    {key:"done",name:"신계약 처리건수",val:m.done,prev:p?.done,kind:"count",good:"none",
      fx:`접수 ${nf(m.total)} · 수동처리 ${nf(m.manualDone)} · 심사중 ${nf(m.pending)}`,targetTxt:"—"},
    {key:"reject",name:"거절률",val:m.reject,prev:p?.reject,kind:"rate",good:"down",target:S.rejectMax/100,cmp:"<=",
      fx:`거절 ${nf(m.st["거절"])} / 심사결정 ${nf(m.decided)}건`,targetTxt:`${S.rejectMax}% 이하`},
  ].map(x=>{
    x.ok=x.target==null||x.val==null?null:(x.cmp===">="?x.val>=x.target:x.val<=x.target);
    if(x.prev!=null&&x.val!=null){
      if(x.kind==="rate"){x.d=(x.val-x.prev)*100;x.dTxt=ppTxt(x.val,x.prev);x.big=Math.abs(x.d)>=S.momP;}
      else{x.d=x.prev?(x.val-x.prev)/x.prev*100:null;x.dTxt=chgTxt(x.val,x.prev);x.big=x.d!=null&&Math.abs(x.d)>=S.momC;}
    }
    return x;});}

/* ---------- rendering ---------- */
function render(){
  if(!CUR)return;
  const m=CUR.m;
  $("meta").innerHTML=`<span>마감월 <b>${CUR.y}.${String(CUR.mo).padStart(2,"0")}</b></span><span>영업일 <b>${m.bizDays}일</b></span><span>당월 <b>${esc(CUR.name)}</b></span><span>전월 <b>${PREV?esc(PREV.name)+` (${PREV.y}.${String(PREV.mo).padStart(2,"0")})`:"없음"}</b></span>`;
  $("banner").hidden=!isSample;
  $("banner").textContent="예시 데이터(가상)를 보여주고 있습니다. 2026년 9월·8월 신계약 마감 데이터를 지어낸 것으로, 점검 기능을 보여주려고 공란·날짜 역전·상태 불일치 같은 이상 데이터를 일부러 섞어 두었습니다. 실제 파일을 올리면 바로 바뀝니다.";
  renderCheck();renderMetrics();
}
let issueFilter="all";
function renderCheck(){
  const iss=CUR.issues;const errRows=CUR.rows.filter(r=>r.err).length;const warnN=iss.filter(i=>i.sev==="경고").length;const errN=iss.length-warnN;
  $("chkSum").innerHTML=`<div><span class="k">전체 행</span><span class="v">${nf(CUR.rows.length)}</span></div>
  <div><span class="k">오류 ${nf(errN)}건 · 행</span><span class="v ${errRows?"crit":"good"}">${nf(errRows)}</span></div>
  <div><span class="k">경고</span><span class="v ${warnN?"warn":"good"}">${nf(warnN)}</span></div>
  <div><span class="k">지표 산출 반영 행</span><span class="v">${nf(CUR.m.used)}</span></div>`;
  const types={};iss.forEach(i=>{const k=i.sev+"|"+i.type+"|"+i.field;types[k]=(types[k]||0)+1;});
  const chips=[`<button type="button" class="chip" data-f="all" aria-pressed="${issueFilter==="all"}">전체 <b>${nf(iss.length)}</b></button>`,
    `<button type="button" class="chip crit" data-f="오류" aria-pressed="${issueFilter==="오류"}">오류 <b>${nf(errN)}</b></button>`,
    `<button type="button" class="chip warn" data-f="경고" aria-pressed="${issueFilter==="경고"}">경고 <b>${nf(warnN)}</b></button>`];
  Object.entries(types).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>{const[s,t,f]=k.split("|");chips.push(`<span class="chip ${s==="오류"?"crit":"warn"}">${esc(t)} · ${esc(f)} <b>${v}</b></span>`);});
  $("chkTypes").innerHTML=chips.join("");
  $("chkTypes").querySelectorAll("button[data-f]").forEach(b=>b.onclick=()=>{issueFilter=b.dataset.f;renderCheck();});
  const list=iss.filter(i=>issueFilter==="all"||i.sev===issueFilter).sort((a,b)=>a.line-b.line);
  $("tblIssues").innerHTML=list.length?`<thead><tr><th class="n">행</th><th>증번</th><th>등급</th><th>유형</th><th>항목</th><th>내용</th></tr></thead><tbody>`+

function deltaHtml(x){

  el.addEventListener("dragover",e=>{e.preventDefault();el.classList.add("over");});
  el.addEventListener("dragleave",()=>el.classList.remove("over"));
  el.addEventListener("drop",e=>{e.preventDefault();el.classList.remove("over");const fl=e.dataTransfer.files[0];if(fl)handleFile(fl,w);});});
$("btnSample").onclick=()=>{$("loadErr").hidden=true;loadSample();toast("예시 데이터를 불러왔습니다.");};

/* settings form */
function fillSettings(){$("sTouch").value=S.touchTarget;$("sDays").value=S.touchDays;$("sAuto").value=S.autoTarget;$("sRej").value=S.rejectMax;$("sMomP").value=S.momP;$("sMomC").value=S.momC;$("sExcl").checked=S.excl;$("holi").value=S.holidays;}
$("btnApply").onclick=()=>{const g=(id,def)=>{const v=parseFloat($(id).value);return isFinite(v)?v:def;};
  S.touchTarget=g("sTouch",90);S.touchDays=Math.round(g("sDays",3));S.autoTarget=g("sAuto",45);S.rejectMax=g("sRej",5);S.momP=g("sMomP",3);S.momC=g("sMomC",10);S.excl=$("sExcl").checked;S.holidays=$("holi").value;
  try{localStorage.setItem("uwm-settings",JSON.stringify(S));}catch(e){}
  if(CUR)recompute(true);toast("산출 기준을 적용했습니다.");};

/* boot */
fillSettings();buildHolidays();
if(!window.XLSX){$("loadErr").hidden=false;$("loadErr").textContent="엑셀 처리 모듈을 불러오지 못했습니다. 네트워크를 확인한 뒤 새로고침해 주세요.";}
else loadSample();
initCaps();initDownloads();
})();
</script>
</body></html>
